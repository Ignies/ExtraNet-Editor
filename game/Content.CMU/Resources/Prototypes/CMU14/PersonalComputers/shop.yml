# Where WeyBay leaves parcels. Put one in the colony's logistics area; without one, parcels are left at the
# terminal they were ordered from. The cargo pallet's own sprite.
- type: entity
  parent: [ BaseCargoPallet, StructureHealthMachineWeak ]
  id: CMUShopPickupPallet
  name: WeyBay pickup pallet
  description: Where the freight run leaves WeyBay parcels. Each crate has a name on it. Please only take yours.
  components:
  - type: CMUShopPickup
  - type: Damageable
    damageModifierSet: SteelMod
