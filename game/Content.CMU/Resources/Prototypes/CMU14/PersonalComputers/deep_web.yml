# The deep web: a hidden network reached only by computers hacked with an access tuner.

- type: cmuNetwork
  id: CMUNetDeep
  name: cmu-net-network-deep

# The skin of The deeps.exi on a hacked computer. Never booted by a computer itself.
- type: cmuComputerOs
  id: CMUOsDeeps
  name: cmu-os-deeps-name
  startLabel: cmu-os-deeps-name
  homePage: deeps://home
  networks:
  - CMUNetDeep
  phosphor: "#E0303A"
  background: "#0A0405"

