    - "Every morning, #number# workers report to #place#."
    - "The colony's animals have adapted well. Mostly to the mess hall bins."
    - "Water here is recycled #number# times before anyone drinks it."
    - "Some say #place# was built in a week. It looks it."
    - "At night, the processor hums a low note heard in every bunk."
