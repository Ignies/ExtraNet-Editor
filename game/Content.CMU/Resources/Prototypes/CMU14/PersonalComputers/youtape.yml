    news.open:
    - "Good evening, {colony}. I am #person# and this is the news."
    - "This is #newsdesk#. Tonight's top story."
    - "Good evening. Here is what happened on {colony} today."
    - "You are watching #newsdesk#. Let's get straight to it."
    news.story:
    - "#thing# went missing from #place# this morning, and nobody will say who signed it out."
    - "Workers at #place# say #thing# has been acting strangely since #weekday#."
    - "#company# says the changes at #place# are routine. Workers say nothing about them is routine."
    - "After #number# hours without power, #place# is back online, mostly."
    - "The colony council met for #number# hours to discuss #thing#. They will meet again."
    news.reporter:
    - "#person#, reporting from #place#"
    - "LIVE: #place#"
    - "#person#, field reporter"
    news.field:
    - "I'm standing at #place#, where #thing# was last seen."
    - "Behind me, workers are still trying to work out what happened."
    - "Witnesses describe a loud bang, then a long silence, then a smaller bang."
    - "Officials have not commented, but one of them did wave."
    - "The scene is calm now, apart from #thing#."
    - "Nobody here has slept since #weekday#."
    news.witness:
    - "I heard it from #place#. I thought it was the recycler again."
    - "I've worked here #number# years and never seen #thing# do that."
    - "Honestly I just want my #object# back."
    - "My supervisor told me not to talk to you. Hi, Mum."
    news.followup:
    - "In other news, #news.story#"
    - "Elsewhere on {colony}, #news.story#"
    - "An update now: #news.story#"
    news.toss:
    - "Let's get a look at the weather."
    - "Now, the forecast."
    - "We go now to the weather desk."
    news.close:
    - "That is the news. Stay safe, {colony}, and lock your airlocks."
    - "For #newsdesk#, I'm #person#. Good night."
    - "That's all for tonight. Remember: report anything unusual. Good night."
