    - "The texture is... I want to say \"load bearing\"."
    - "The packet says to add water. I added coffee. Bold choice."
    - "I'm giving it a #number# out of 10. The 10 is a lie."
    - "Somebody in the comments asked if it is meant to fizz. It is fizzing."
    food.close:
    - "That's it for today. If I don't post next week, it was the #food#."
