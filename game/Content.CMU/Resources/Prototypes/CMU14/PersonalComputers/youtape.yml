    - "Night shift starts in an hour, so this is a quick one."
    - "You asked for a bunk tour, so here it is. All four square metres."
    bunk.story:
    - "This is my #object#. It has been with me since Earth."
    - "The vent above my bunk makes a noise at night. Maintenance says that is normal."
    - "My bunkmate #first# says hi. My bunkmate is asleep."
    - "This is where I keep the good snacks. You did not see this."
    - "Somebody keeps leaving #object# on my pillow. I have questions."
    bunk.close:
    - "That's my bunk! Rewind for more!"
    - "Okay, I have to go fix #thing#. Bye!"
    - "Thanks for watching. Write in. I read every letter. Eventually."
