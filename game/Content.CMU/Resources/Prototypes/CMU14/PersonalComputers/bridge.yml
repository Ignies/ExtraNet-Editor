# The console bridge: which consoles on colony maps run the PC OS, with their own screen as a desktop program.
# Every computer counts: anything anchored that opens an interface and whose prototype or a parent is named like a
# computer (keywords), or is, or inherits from, anything under include; except anything excluded by name or keyword.
# So a new console, or monitor, or terminal is bridged with no change to its prototype. A computer that is already a PC
# opened by a verb, like the Marshals' camera monitors, gets its own window as a program too.
# Admins switch the whole bridge with the cmu.pc.bridge cvar.

- type: cmuComputerBridge
  id: Default
  include:
  - RMCCommunicationsConsoleBase # colony economy, records, objectives, tech, HERMES and faction consoles
  - CMASRSConsole                # requisitions
  - RMCMonitorCameraAlmayer      # security camera monitors (only those placed on colony maps)
  - RMCIDComputer
  - CMUResearchDataTerminal
  - BaseComputer                 # upstream SS14 computers placed on colonies
  - VehicleSupplyConsole
  keywords:
  - Console
  - Computer
  - Terminal
  - Monitor
  # Dropship consoles fly the dropship: they stay as they are.
  excludeKeywords:
  - Dropship
  exclude:
  # A map table and a television are not computers, and medical machines keep their own screens.
  - RMCTacticalMapTable
  - ComputerTelevision
  - CMUAutodocConsole
  - CMUBodyScannerConsole
  os:
    AU14CorporateConsoleBase: CMUOsWeyland
    AU14CorporateASRSConsole: CMUOsWeyland
    ComputerObjectivesWeYu: CMUOsWeyland
    CMUMonitorCameraColonyWEYU: CMUOsWeyland
    CMUMonitorCameraColonyWEYUSpy: CMUOsWeyland
    RMCAIConsoleHERMES: CMUOsWeyland
    RMCOverwatchConsoleWeYa: CMUOsWeyland
  # Colony security's own consoles also reach its network: the terminal map and the unauthorized use log.
  networks:
    AUDepartmentConsoleSecurity: [CMUNetSecurity]
    CMUMonitorCameraColonyGovfor: [CMUNetSecurity]
